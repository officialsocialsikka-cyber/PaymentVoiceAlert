
name: Build My Payment Speaker Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        working-directory: MyPaymentSpeaker
        run: gradle assembleRelease

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Align and Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="MyPaymentSpeaker/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          test -f "$APK"

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out MyPaymentSpeaker/app/build/outputs/apk/release/MyPaymentSpeaker-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose \
            MyPaymentSpeaker/app/build/outputs/apk/release/MyPaymentSpeaker-release-signed.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Payment-Speaker-Signed-Release
          path: MyPaymentSpeaker/app/build/outputs/apk/release/MyPaymentSpeaker-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          rm -f "$RUNNER_TEMP/aligned.apk"
